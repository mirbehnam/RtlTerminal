name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read project version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content RtlTerminal.csproj
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = $project.Project.PropertyGroup.VersionPrefix | Select-Object -First 1
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'Could not read Version from RtlTerminal.csproj.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Publish application
        run: >-
          dotnet publish RtlTerminal.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          --output publish/win-x64

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\RtlTerminal.iss

      - name: Package application
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath RtlTerminal-${{ steps.version.outputs.version }}-win-x64.zip

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: pwsh
        run: |
          $installer = "release/RtlTerminal-Setup-$env:VERSION-x64.exe"
          $releaseExists = gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG "RtlTerminal-$env:VERSION-win-x64.zip" --clobber
            gh release upload $env:TAG $installer --clobber
          } else {
            gh release create $env:TAG "RtlTerminal-$env:VERSION-win-x64.zip" $installer `
              --title "RtlTerminal $env:VERSION" `
              --generate-notes `
              --target $env:GITHUB_SHA
          }
