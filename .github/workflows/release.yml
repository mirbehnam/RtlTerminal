name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read project version
        id: version
        shell: pwsh
        run: |
          $version = dotnet msbuild RtlTerminal.csproj -getProperty:Version -nologo
          $version = ($version | Select-String -Pattern '"Version":\s*"([^"]+)"').Matches.Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'Could not read Version from RtlTerminal.csproj.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Publish application
        run: >-
          dotnet publish RtlTerminal.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish/release

      - name: Package application
        shell: pwsh
        run: Compress-Archive -Path publish/release/* -DestinationPath RtlTerminal-${{ steps.version.outputs.version }}-win-x64.zip

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: pwsh
        run: |
          $releaseExists = gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG "RtlTerminal-$env:VERSION-win-x64.zip" --clobber
          } else {
            gh release create $env:TAG "RtlTerminal-$env:VERSION-win-x64.zip" `
              --title "RtlTerminal $env:VERSION" `
              --generate-notes `
              --target $env:GITHUB_SHA
          }
